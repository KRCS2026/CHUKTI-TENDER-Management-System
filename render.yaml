services:
  - type: web
    name: chukti
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: chukti-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.11.0
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /opt/render/project/src/data/database.db
      - key: JWT_SECRET
        generateValue: true
